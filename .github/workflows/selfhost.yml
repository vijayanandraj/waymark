name: selfhost
on:
  pull_request:
    paths: ["selfhost/**", ".github/workflows/selfhost.yml"]
  push:
    branches: [main]
    paths: ["selfhost/**", ".github/workflows/selfhost.yml"]
jobs:
  selfhost-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selfhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: selfhost/web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24", cache: false }
      - run: cd web && npm ci && npm run build
      - run: cd server && go vet ./... && go build -o bin/server ./cmd/server
      - run: scripts/smoke.sh server/bin/server
      - name: UI smoke test
        run: |
          (cd server && ./bin/server -addr 127.0.0.1:8090 -data /tmp/ci-data &) && sleep 1
          npm i -g playwright && npx playwright install --with-deps chromium
          # Imports resolve from the script's own folder, so run a copy next to the linked packages.
          cd /tmp && ln -s "$(npm root -g)" node_modules && cp "$GITHUB_WORKSPACE/selfhost/scripts/ui-smoke.mjs" . && node ui-smoke.mjs http://127.0.0.1:8090
  selfhost-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openroadmap selfhost
