name: site
on:
  pull_request:
    paths: ["roadmaps/**", "site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["roadmaps/**", "site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      # Runs before npm ci on purpose: it needs no dependencies, so content
      # problems are reported in seconds and annotated on the pull request.
      - name: Validate roadmaps
        run: node scripts/validate.mjs
      - run: npm ci
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
