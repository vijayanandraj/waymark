name: links
on:
  pull_request:
    paths: ["roadmaps/**/roadmap.json"]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On a pull request, check only the roadmaps it changes.
  changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: files
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'roadmaps/*/roadmap.json' | tr '\n' ' ')
          echo "list=$files" >> "$GITHUB_OUTPUT"
      - if: steps.files.outputs.list != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --timeout 20 --accept '100..=103,200..=299,403,429' ${{ steps.files.outputs.list }}
          fail: true

  # Weekly sweep of everything; opens an issue listing what has broken since.
  all:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --timeout 20 --accept '100..=103,200..=299,403,429' 'roadmaps/*/roadmap.json'
          output: lychee/out.md
          fail: false
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links in roadmaps
          content-filepath: lychee/out.md
          labels: broken-links
